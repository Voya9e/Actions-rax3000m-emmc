name: Build OpenWrt 25.12

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      USE_NX30PRO_EEPROM:
        description: Use NX30 Pro EEPROM calibration
        required: true
        default: true
        type: boolean
      USE_52MHZ:
        description: Use 52MHz eMMC max-frequency (may be unstable on some devices)
        required: true
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  FREE_DISK_SH: scripts/free_disk_space.sh
  ENV_SH: scripts/environment.sh
  DIY_SH: scripts/diy-openwrt-25.12.sh
  CLASH_CORE: scripts/preset-clash-core.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5

      - name: Prepare build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          chmod +x "$FREE_DISK_SH" "$ENV_SH"
          "$FREE_DISK_SH"
          sudo -E apt-get -qq update -y
          sudo -E apt-get -qq full-upgrade -y
          bash "$ENV_SH"
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER":"$GROUPS" /workdir

      - name: Clone OpenWrt 25.12
        working-directory: /workdir
        run: |
          git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Restore build cache
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: 'true'
          mixkey: openwrt25-cortexa53
          prefix: ${{ github.workspace }}/openwrt

      - name: Configure feeds and LAN
        run: |
          cd openwrt
          chmod +x "$GITHUB_WORKSPACE/$DIY_SH"
          "$GITHUB_WORKSPACE/$DIY_SH"
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p packages
          ./scripts/feeds install -a -p luci
          ./scripts/feeds install -a -p routing
          ./scripts/feeds install -a -p telephony
          ./scripts/feeds install -p openclash luci-app-openclash
          ./scripts/feeds install -p argon luci-theme-argon
          ./scripts/feeds install -p footstrap luci-theme-footstrap
          ./scripts/feeds install -p diskman luci-app-diskman
          ./scripts/feeds install -p small luci-app-autoreboot
          ./scripts/feeds install -p jell luci-app-filebrowser-q
          python3 "$GITHUB_WORKSPACE/scripts/patch-filebrowser-q-prebuilt.py" "$PWD"
          python3 "$GITHUB_WORKSPACE/scripts/apply-openwrt-25.12-theme-menu.py" "$PWD"

      - name: Import RAX3000M configuration
        run: |
          cat configs/openwrt-25.12-rax3000m-emmc.config >> openwrt/.config
          cd openwrt
          make defconfig
          # The theme-menu script patches these sources after build-cache restore.
          # Clean their cached build outputs so the patched dispatcher and menus
          # are guaranteed to be installed into the image.
          make package/luci-base/clean
          make package/luci-theme-argon/clean
          make package/luci-theme-footstrap/clean

      - name: Select EEPROM calibration
        if: inputs.USE_NX30PRO_EEPROM
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/apply-openwrt-25.12-eeprom.py" \
            "$GITHUB_WORKSPACE/eeprom/nx30pro_eeprom.bin" \
            openwrt/target/linux/mediatek/dts/mt7981b-cmcc-rax3000m-emmc.dtso

      - name: Set eMMC speed
        if: inputs.USE_52MHZ
        run: |
          DTS=openwrt/target/linux/mediatek/dts/mt7981b-cmcc-rax3000m-emmc.dtso
          sed -i '/bus-width = <8>;/a\            cap-mmc-highspeed;' "$DTS"
          sed -i 's/26000000/52000000/g' "$DTS"
          grep -E 'bus-width|max-frequency|cap-mmc-highspeed' "$DTS"

      - name: Download sources
        run: |
          cd openwrt
          chmod +x "$GITHUB_WORKSPACE/$CLASH_CORE"
          "$GITHUB_WORKSPACE/$CLASH_CORE"
          make defconfig
          make download -j8 V=10
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          make -j"$(($(nproc)+1))" || make -j"$(nproc)" || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Prepare eMMC release assets
        if: steps.compile.outputs.status == 'success'
        run: |
          mkdir -p release
          TARGET_DIR=openwrt/bin/targets/mediatek/filogic
          find "$TARGET_DIR" -maxdepth 1 -type f \
            -name '*cmcc_rax3000m-emmc*' -exec cp {} release/ \;
          SYSUPGRADE="$TARGET_DIR/openwrt-mediatek-filogic-cmcc_rax3000m-squashfs-sysupgrade.itb"
          test -f "$SYSUPGRADE"
          cp "$SYSUPGRADE" release/openwrt-mediatek-filogic-cmcc_rax3000m-emmc-squashfs-sysupgrade.itb
          test -f release/openwrt-mediatek-filogic-cmcc_rax3000m-emmc-squashfs-sysupgrade.itb
          INITRAMFS="$TARGET_DIR/openwrt-mediatek-filogic-cmcc_rax3000m-initramfs-recovery.itb"
          test -f "$INITRAMFS"
          cp "$INITRAMFS" release/openwrt-mediatek-filogic-cmcc_rax3000m-emmc-initramfs-recovery.itb
          test -f release/openwrt-mediatek-filogic-cmcc_rax3000m-emmc-initramfs-recovery.itb
          test -n "$(find release -maxdepth 1 -type f -print -quit)"
          (
            cd release
            find . -maxdepth 1 -type f ! -name sha256sums -print0 \
              | sort -z | xargs -0 sha256sum > sha256sums
          )
          if [ "${{ inputs.USE_52MHZ }}" = "true" ]; then FREQ=52; else FREQ=26; fi
          if [ "${{ inputs.USE_NX30PRO_EEPROM }}" = "true" ]; then EEPROM_STATUS=nx30pro_eeprom; else EEPROM_STATUS=default_eeprom; fi
          BUILD_DATE=$(date +%Y.%m.%d)
          printf '%s\n' \
            "OpenWrt branch: openwrt-25.12" \
            "Device: CMCC RAX3000M eMMC" \
            "eMMC max-frequency: ${FREQ}MHz" \
            "EEPROM: ${EEPROM_STATUS}" > release.txt
          echo "FREQ=$FREQ" >> "$GITHUB_ENV"
          echo "EEPROM_STATUS=$EEPROM_STATUS" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"

      - name: Publish release
        if: steps.compile.outputs.status == 'success' && !cancelled()
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ format('{0}-openwrt-25.12-rax3000m-emmc-{1}-{2}mhz-run{3}', env.BUILD_DATE, env.EEPROM_STATUS, env.FREQ, github.run_number) }}
          name: OpenWrt 25.12 RAX3000M eMMC ${{ env.EEPROM_STATUS }} ${{ env.FREQ }}MHz
          body_path: release.txt
          files: release/*

